# Plan Phase 8: one e2-micro VM in oak-street-house-bills, images in Artifact Registry.
service: house_bills

image: oak-street-house-bills/house-bills/house_bills

servers:
  web:
    - 35.252.107.44

# The e2-micro needs more than Kamal's default 30s to migrate and boot a new version while the
# old one is still running.
deploy_timeout: 180

# kamal-proxy gets a Let's Encrypt certificate for this host (assume_ssl/force_ssl are on in production.rb).
proxy:
  ssl: true
  host: house-bills.kevinchambers.com

registry:
  server: us-west1-docker.pkg.dev
  username: oauth2accesstoken
  password:
    - KAMAL_REGISTRY_PASSWORD

ssh:
  user: kamal

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    # Solid Queue runs inside Puma. Puma in single mode (no WEB_CONCURRENCY) with 3 threads fits the 1 GB VM.
    SOLID_QUEUE_IN_PUMA: true
    RAILS_MAX_THREADS: 3
    # Where DatabaseBackup uploads daily/ and monthly/ copies (Litestream's replica is in config/litestream.yml).
    BACKUP_BUCKET: oak-street-house-bills-backups

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

# The SQLite databases. production.sqlite3 is also replicated to Cloud Storage by Litestream.
volumes:
  - "house_bills_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests.
asset_path: /rails/public/assets

# Build on this Mac (OrbStack, Rosetta); the e2-micro doesn't have the memory.
builder:
  arch: amd64
